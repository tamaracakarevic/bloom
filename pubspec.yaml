name: bloom
description: "Bloom — lični dnevnik kilaže, mera i kalorija."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter_localizations:
    sdk: flutter
  file_picker: ^8.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1
  health: ^13.1.3
  share_plus: ^12.0.2
  shared_preferences: ^2.3.3
  timezone: ^0.10.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
